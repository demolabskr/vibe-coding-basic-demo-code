{% load shop_extras %}<div style="font-family: sans-serif; max-width: 520px; color: #1f2328;">
  <h2 style="margin: 0 0 12px;">구매가 완료되었습니다</h2>
  <p>{{ order.buyer.username }}님, 구매해 주셔서 감사합니다.</p>
  <table style="border-collapse: collapse; width: 100%;">
    <tr><td style="padding: 6px 0; color: #5b6470;">주문 번호</td><td>{{ order.order_no }}</td></tr>
    <tr><td style="padding: 6px 0; color: #5b6470;">콘텐츠</td><td>{{ order.content.title }}</td></tr>
    <tr><td style="padding: 6px 0; color: #5b6470;">금액</td><td>{{ order.amount|won }}</td></tr>
    <tr><td style="padding: 6px 0; color: #5b6470;">결제 시각</td><td>{{ order.paid_at|date:"Y-m-d H:i" }}</td></tr>
  </table>
  <p style="margin: 20px 0;"><a href="{{ library_url }}" style="background: #e8590c; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none;">내 자료실 열기</a></p>
  <p style="color: #5b6470; font-size: 12px;">{{ site_name }} · 이 메일은 예시 사이트에서 보낸 것입니다.</p>
</div>
