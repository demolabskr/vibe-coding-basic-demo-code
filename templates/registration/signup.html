{% extends "base.html" %}
{% block title %}가입 · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>가입</h1>
  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <p class="hint">가입하면 <a href="{% url 'privacy' %}">개인정보 처리 안내</a>에 동의하는 것으로 봅니다. 메일 주소는 구매 확인과 비밀번호 재설정에만 씁니다.</p>
    <button class="buy-button full" type="submit">가입하기</button>
  </form>
  <p class="form-links">이미 가입했다면 <a href="{% url 'login' %}">로그인</a></p>
</div>
{% endblock %}
