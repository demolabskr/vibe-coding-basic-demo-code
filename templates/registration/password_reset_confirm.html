{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h1>새 비밀번호 정하기</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{% include "includes/form_fields.html" %}<button class="buy-button full" type="submit">바꾸기</button></form>
  {% else %}
    <p>링크가 만료되었거나 이미 쓴 링크입니다. 다시 요청해 주세요.</p>
  {% endif %}
</div>
{% endblock %}
