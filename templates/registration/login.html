{% extends "base.html" %}
{% block title %}로그인 · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>로그인</h1>
  {% if next and not user.is_authenticated %}<p class="notice">구매하려면 로그인이 필요합니다.</p>{% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="buy-button full" type="submit">로그인</button>
  </form>
  <p class="form-links">
    처음이면 <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">가입하기</a>
    · <a href="{% url 'password_reset' %}">비밀번호를 잊었다면</a>
  </p>
</div>
{% endblock %}
