# 저장소에 올릴 때마다 테스트를 돌린다
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"   # 따옴표가 없으면 숫자로 읽혀 3.1이 될 수 있다
      - run: uv sync --frozen
      - run: uv run python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          # 테스트는 디버그를 끈 운영 설정으로 돈다. 테스트용 요청은 HTTP라 HTTPS 강제 이동만 끈다
          DJANGO_SECURE_SSL_REDIRECT: "false"
