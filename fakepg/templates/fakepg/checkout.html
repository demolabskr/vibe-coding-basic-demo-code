<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가상 결제창</title>
  <style>
    body { margin: 0; font-family: system-ui, "Apple SD Gothic Neo", sans-serif; background: #e9edf3; color: #17202a; }
    .pg { max-width: 400px; margin: 48px auto; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); overflow: hidden; }
    .pg-head { background: #0b3d91; color: #fff; padding: 18px 22px; }
    .pg-head small { display: block; opacity: .8; }
    .pg-body { padding: 22px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eef1f5; }
    .amount { font-size: 1.6rem; font-weight: 800; text-align: right; margin: 18px 0; }
    .card { border: 1px dashed #9aa7b8; border-radius: 10px; padding: 14px; color: #4a5a6e; font-size: .9rem; margin-bottom: 18px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .approve { background: #0b3d91; color: #fff; margin-bottom: 8px; }
    .cancel { background: #eef1f5; color: #17202a; }
    .notice { font-size: .8rem; color: #6b7a8c; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="pg">
    <div class="pg-head"><strong>가상 결제 서비스</strong><small>fakepg · 테스트 모드</small></div>
    <div class="pg-body">
      <div class="row"><span>주문 번호</span><span>{{ data.order_no }}</span></div>
      <div class="row"><span>상품</span><span>{{ data.order_name }}</span></div>
      <p class="amount">{{ amount }}원</p>
      <div class="card">테스트 카드 **** **** **** 4242<br>실제 카드 정보를 받지 않습니다.</div>
      <form method="post">
        {% for key, value in data.items %}{% if key != "action" %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}{% endfor %}
        <button class="approve" name="action" value="approve">결제 승인</button>
        <button class="cancel" name="action" value="cancel">취소</button>
      </form>
      <p class="notice">결제 대행 서비스가 띄우는 결제창을 흉내 낸 화면입니다. 실제 돈은 오가지 않습니다.</p>
    </div>
  </div>
</body>
</html>
